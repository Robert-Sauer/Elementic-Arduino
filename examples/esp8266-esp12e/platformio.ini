[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
build_flags =
    -DUSE_WIFI
    -DELEMENTIC_MAX_INPUTS=15
    -DELEMENTIC_MAX_OUTPUTS=15
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    symlink://../..
    knolleary/PubSubClient@^2.8

[env:esp12e-v2]
extends = env:esp12e
build_flags =
    ${env:esp12e.build_flags}
    -DELEMENTIC_WIRE_PROTOCOL_VERSION=2
