[platformio]
src_dir = src

[env]
platform = raspberrypi
framework = arduino
build_flags = -include include/ProjectVariablesAutomated.h
lib_deps =
    symlink://../../..
    arduino-libraries/Ethernet
    knolleary/PubSubClient@^2.8.0

[env:rpipico2w]
board = rpipico2w

[env:rpipicow]
board = rpipicow

[env:rpipico]
board = rpipico

[env:rpipico2]
board = rpipico2

[env:wiznet_5100s_evb_pico]
board = wiznet_5100s_evb_pico

[env:wiznet_5100s_evb_pico2]
board = wiznet_5100s_evb_pico2
