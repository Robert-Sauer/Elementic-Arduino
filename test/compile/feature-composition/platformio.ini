[platformio]
; Keep dependencies outside this symlinked Library's source tree: otherwise
; LDF mistakes nested dependency headers for Elementic's own headers.
libdeps_dir = ${sysenv.TEMP}/elementic-feature-composition-libdeps

[env]
platform = atmelavr
board = controllino_maxi
framework = arduino
lib_ldf_mode = chain+
build_flags = -include include/ProjectVariablesAutomated.h
lib_deps = symlink://../../..

[env:offline_v1]
build_flags =
    ${env.build_flags}
    -DELEMENTIC_WIRE_PROTOCOL_VERSION=1

[env:offline_v2]
build_flags =
    ${env.build_flags}
    -DELEMENTIC_WIRE_PROTOCOL_VERSION=2

[env:ethernet_only]
build_flags =
    ${env.build_flags}
    -DTEST_ETHERNET=1
    -DELEMENTIC_WIRE_PROTOCOL_VERSION=2
lib_deps =
    ${env.lib_deps}
    arduino-libraries/Ethernet@^2.0.0

[env:ethernet_mqtt_v1]
build_flags =
    ${env.build_flags}
    -DTEST_ETHERNET=1
    -DTEST_MQTT=1
    -DELEMENTIC_WIRE_PROTOCOL_VERSION=1
lib_deps =
    ${env.lib_deps}
    arduino-libraries/Ethernet@^2.0.0
    knolleary/PubSubClient@^2.8.0

[env:ethernet_mqtt_v2]
extends = env:ethernet_mqtt_v1
build_flags =
    ${env.build_flags}
    -DTEST_ETHERNET=1
    -DTEST_MQTT=1
    -DELEMENTIC_WIRE_PROTOCOL_VERSION=2

[env:soft_disabled]
extends = env:ethernet_mqtt_v2
build_flags =
    ${env:ethernet_mqtt_v2.build_flags}
    -DTEST_SOFT_ENABLED=0

; Compile-only fixture: no hardware flash or catalogue identity assertion.
[env:bluepill_offline]
platform = ststm32
board = bluepill_f103c8
upload_protocol = stlink
monitor_speed = 115200
build_flags =
    ${env.build_flags}
    -DELEMENTIC_DISABLE_DMX
    -DELEMENTIC_WIRE_PROTOCOL_VERSION=2
    -DUSBCON
    -DUSBD_USE_CDC
    -DHAL_PCD_MODULE_ENABLED
    -DUSBD_VID=0x0483
    -DUSBD_PID=0x5740

[env:bluepill_serasidis]
extends = env:bluepill_offline
upload_protocol = hid
board_build.flash_offset = 0x800
board_upload.maximum_size = 63488
build_flags =
    ${env:bluepill_offline.build_flags}
    -DELEMENTIC_BOOTLOADER_SERASIDIS_HID=1
    -DEEPROM_FLASH_PAGE_NUMBER=63
